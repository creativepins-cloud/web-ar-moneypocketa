<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Tangkap Duit Raya - WebAR</title>
    <!-- Muat turun Library A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Stail untuk paparan Markah di skrin telefon */
      #score-board {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #ffeb3b;
        padding: 10px 20px;
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
        border-radius: 10px;
        z-index: 999;
        pointer-events: none;
      }
    </style>

    <script>
      let score = 0;

      // Komponen untuk logik objek duit raya yang boleh ditekan
      AFRAME.registerComponent('duit-raya', {
        init: function () {
          const el = this.el;
          
          // Apabila objek duit disentuh/ditekan
          el.addEventListener('click', () => {
            score += 10;
            document.getElementById('score-value').innerText = score;
            
            // Alihkan kedudukan objek secara rawak di atas sampul selepas ditekan
            const randomX = (Math.random() - 0.5) * 0.8;
            const randomZ = (Math.random() - 0.5) * 0.8;
            el.setAttribute('position', `${randomX} 0.8 ${randomZ}`);
          });
        }
      });
    </script>
  </head>
  <body>
    <!-- Papan Markah di Skrin -->
    <div id="score-board">Duit Raya Terkumpul: RM <span id="score-value">0</span></div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Anda boleh tukar model glb ini kepada model sampul/duit raya anda -->
        <a-asset-item id="moneyModel" src="./model.glb"></a-asset-item>
      </a-assets>

      <!-- Kamera dengan tetapan pengesan klik (raycaster) -->
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse;" raycaster="objects: [duit-raya]"></a-camera>

      <!-- Sasaran Imej (Sampul Duit Raya Fizikal) -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Objek Duit Raya 1 (Interaktif & Berputar) -->
        <a-gltf-model 
          src="#moneyModel" 
          position="0 0.5 0" 
          scale="1.5 1.5 1.5" 
          rotation="0 0 0"
          duit-raya
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
        </a-gltf-model>

        <!-- Objek Duit Raya 2 (Kedudukan berbeza) -->
        <a-gltf-model 
          src="#moneyModel" 
          position="0.3 0.8 -0.2" 
          scale="1.2 1.2 1.2" 
          rotation="0 0 0"
          duit-raya
          animation="property: rotation; to: 360 360 0; loop: true; dur: 4000; easing: linear">
        </a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
